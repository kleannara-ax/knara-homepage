plugins {
    id 'org.springframework.boot' version '2.7.4'
    id 'io.spring.dependency-management' version '1.0.14.RELEASE'
    id 'java'
    id 'war'
}

group = 'com'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '1.8'
apply plugin: 'war'
war {
    enabled = true
    webInf { // webInf에 processeResources의 결과 디렉토리를 포함하도록 추가
        with {
            from("${buildDir}/resources/main")
        }
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    war.archiveName = 'klean.war'
}

repositories {
    mavenCentral()
}

bootWar.enabled = false
war.enabled = true

dependencies {
    //tymeleaf
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    //springboot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-web-services'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.2.2'
    //mybatis
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    //connector
    implementation group: 'org.mariadb.jdbc', name: 'mariadb-java-client', version: '2.4.1'
    //security
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-security', version: '2.4.5'
    //db log
    implementation group: 'org.bgee.log4jdbc-log4j2', name: 'log4jdbc-log4j2-jdbc4.1', version: '1.16'
    //gson
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.8.5'
    implementation group: 'com.googlecode.json-simple', name: 'json-simple', version: '1.1.1'
    //email
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    //device
    implementation group: 'org.springframework.mobile', name: 'spring-mobile-device', version: '1.1.3.RELEASE'
    //http
    implementation 'org.apache.httpcomponents:httpclient:4.5'
    //jndi
    implementation 'org.apache.commons:commons-dbcp2'
    // Jakarta Servlet API
    implementation 'jakarta.servlet:jakarta.servlet-api:5.0.0'
    // Apache Commons Text (HTML 이스케이프 처리)
    implementation 'org.apache.commons:commons-text:1.10.0'
    // Quartz 스케줄러
    implementation 'org.springframework.boot:spring-boot-starter-quartz'


    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
