<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden - 깨끗한나라</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            max-width: 400px;
        }
        .container h1 {
            font-size: 2em;
            color: #d9534f;
            margin-bottom: 10px;
        }
        .container p {
            font-size: 1.1em;
            margin-bottom: 20px;
        }
        .container a {
            display: inline-block;
            padding: 10px 20px;
            font-size: 1em;
            color: #fff;
            background-color: #007BFF;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .container a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<div class="container">
    <!--<h1>403 Forbidden</h1>-->
    <p>접근이 거부되었습니다.<br/>해당 페이지에 대한 권한이 없습니다.</p>
    <p>허용된 IP에서 접속하고 있는지 확인해주세요.</p>
    <a href="/">홈으로 돌아가기</a>
</div>
</body>
</html>
