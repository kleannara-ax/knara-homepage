<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" >

<th:block layout:fragment="head" th:include="@{/admin/fragment/admin_head}"></th:block>

<body class="admin">
<th:block layout:fragment="header" th:include="@{/admin/fragment/admin_header}"></th:block>
<th:block layout:fragment="gnb" th:include="@{/admin/fragment/admin_gnb}"></th:block>
<div class="container">
	<th:block layout:fragment="lnb" th:include="@{/admin/fragment/admin_lnb}"></th:block>
	<!--content-->
	<form id="sForm" method="post" enctype="multipart/form-data" th:object="${data}">
		<input type="hidden" th:if="*{idx}" th:field="*{idx}" />
		<input type="hidden" name="type" th:value="${params.type}" />
		<div class="content">
			<div>
				<header>
					<th:block th:switch="${params.type}">
						<h3 th:case="1" th:text="|ESG 경영 보고서 상세|"></h3>
						<h3 th:case="2" th:text="|전자공고 관리|"></h3>
						<h3 th:case="3" th:text="|영업보고서 관리|"></h3>
						<h3 th:case="4" th:text="|감사보고서 관리|"></h3>
						<h3 th:case="5" th:text="|IR자료 관리|"></h3>
					</th:block>
				</header>
				<div class="breadcrumbs">
					<ol>
						<th:block th:switch="${params.type}">
							<li th:case="1" th:text="|ESG 경영관리|"></li>
							<li th:case="1" th:text="|ESG 경영 보고서 관리 목록|"></li>
							<li th:case="2" th:text="|투자정보 관리|"></li>
							<li th:case="2" th:text="|전자공고 관리 목록|"></li>
							<li th:case="3" th:text="|투자정보 관리|"></li>
							<li th:case="3" th:text="|영업보고서 관리 목록|"></li>
							<li th:case="4" th:text="|투자정보 관리|"></li>
							<li th:case="4" th:text="|감사보고서 관리 목록|"></li>
							<li th:case="5" th:text="|투자정보 관리|"></li>
							<li th:case="5" th:text="|IR자료 관리 목록|"></li>
						</th:block>
					</ol>
				</div>
				<div class="list-type">
					<th:block th:switch="${params.type}">
						<h4 th:case="1" th:text="|ESG 경영 보고서 상세|"></h4>
						<h4 th:case="2" th:text="|전자공고 관리|"></h4>
						<h4 th:case="3" th:text="|영업보고서 관리|"></h4>
						<h4 th:case="4" th:text="|감사보고서 관리|"></h4>
						<h4 th:case="5" th:text="|IR자료 관리|"></h4>
					</th:block>
					<table class="tbl-type02">
						<colgroup>
							<col style="width: 17%;">
							<col style="width:33%">
							<col style="width: 17%">
							<col>
						</colgroup>
						<tbody>
						<tr>
							<th>제목<sup>*</sup></th>
							<td colspan="3">
								<input type="text" class="all" th:field="*{title}">
							</td>
						</tr>
						<tr data-type="2" style="display: none;">
							<th>상위노출</th>
							<td colspan="3">
								<input type="checkbox" id="noticeChk" name="top_yn" value="Y" th:checked="*{top_yn eq 'Y'}"/>
								<label for="noticeChk">주요공지</label>
								<span class="inner" style="display:inline-block; margin-top:3px;vertical-align:top">※ 선택 시 상단에 고정 공지 됩니다. </span>
							</td>
						</tr>
						<tr data-type="2" style="display: none;">
							<th>내용<sup>*</sup></th>
							<td colspan="3">
								<textarea style="height:400px;" name="content" id="content" th:text="*{content}"></textarea>
							</td>
						</tr>
						<tr>
							<th>첨부파일<sup>*</sup></th>
							<td colspan="3">
								<div class="filebox">
									<input type="text" class="upload-name file_name" name="file_name" disabled="" th:value="*{file_name}">
									<label for="ex_filename01" class="btn gray01 image-click">파일선택</label>
									<input type="file" id="ex_filename01" class="upload-hidden" name="file">
									<input type="hidden" class="pre_path" name="pre_file_path" th:value="*{file_path}">
									<input type="hidden" class="pre_name" name="pre_file_name" th:value="*{file_name}">
									<div class="file">
										<span class="file_name"></span>
										<a href="javascript:void(0);" class="btn-del"></a>
									</div>
								</div>
							</td>
						</tr>
						<tr>
							<th>연도선택</th>
							<td colspan="3">
								<div class="filebox">
									<select class="w150" id="sYear" name="sYear" >
										<option value="2022" th:selected="*{sYear eq '2022'}">2022년</option>
										<option value="2023" th:selected="*{sYear eq '2023'}">2023년</option>
										<option value="2024" th:selected="*{sYear eq '2024'}">2024년</option>
										<option value="2025" th:selected="*{sYear eq '2025'}">2025년</option>
										<option value="2026" th:selected="*{sYear eq '2026'}">2026년</option>
										<option value="2027" th:selected="*{sYear eq '2027'}">2027년</option>
										<option value="2028" th:selected="*{sYear eq '2028'}">2028년</option>
										<option value="2029" th:selected="*{sYear eq '2029'}">2029년</option>
										<option value="2030" th:selected="*{sYear eq '2030'}">2030년</option>
									</select>
								</div>
							</td>
						</tr>
						<tr>
							<th>노출여부<sup>*</sup></th>
							<td>
								<input type="radio" id="viewOn" value="Y" name="show_yn" th:checked="*{show_yn eq 'Y'} or ${#strings.isEmpty(data.show_yn)}">
								<label for="viewOn">노출</label>
								<input type="radio" id="viewOff" value="N" name="show_yn" th:checked="*{show_yn eq 'N'}">
								<label for="viewOff">미노출</label>
							</td>
							<th>작성자</th>
							<!-- ORG <td th:field="*{reg_member_}"></td> -->
							<td><span id="sessionAdminName" th:text="*{reg_AdminName}"></span> (<span id="sessionAdminID" th:text="*{reg_AdminID}"></span>)</td>
						</tr>
						</tbody>
					</table>
					<div class="cont">
						<a th:if="${params.type == '2' || params.type == '3' || params.type == '4' || params.type == '5'}" th:href="|javascript:goView('/AdminInvest/reportList');|" class="btn gray03 large">목록</a>
						<a th:if="${params.type == '1' || params.type == '6'}"  th:href="|javascript:goView('/AdminReport/reportList');|" class="btn gray03 large">목록</a>
						<div class="btn-group">
							<th:block th:if="${data.idx == 0}">
								<a href="javascript:void(0);" class="btn gray02 large btn_cancel">취소</a>
								<a href="javascript:void(0);" class="btn c01 large btn_save">등록</a>
							</th:block>
							<th:block th:if="${data.idx > 0}">
								<a href="javascript:void(0);" class="btn gray02 large btn_delete">삭제</a>
								<a href="javascript:void(0);" class="btn c01 large btn_save">수정</a>
							</th:block>
						</div>
					</div>
				</div>
			</div>
			<th:block layout:fragment="footer" th:include="@{/admin/fragment/admin_footer}"></th:block>
		</div>
	</form>
	<!--//content-->
</div>
<script th:inline="javascript">
    /*<![CDATA[*/
    let type = [[ ${params.type} ]];
    let controller = "/AdminReport";
    if(type !== '1')
        controller = "/AdminInvest";

    let oEditors = [];
    $(document).ready(function(){
		changeType(type);

		var tempID = [[ ${session.admin_id} ]];
		console.log("## tempID = ", tempID);

		var tempName = [[ ${session.admin_name} ]];
		console.log("## tempName = ", tempName);

        $('#sessionAdminID').text(tempID);
        $('#sessionAdminName').text(tempName);

        nhn.husky.EZCreator.createInIFrame({
            oAppRef: oEditors,
            elPlaceHolder: "content",
            sSkinURI: "/smart_editor/SmartEditor2Skin.html",
            htParams : {
                bUseToolbar : true,				// 툴바 사용 여부 (true:사용/ false:사용하지 않음)
                bUseVerticalResizer : true,		// 입력창 크기 조절바 사용 여부 (true:사용/ false:사용하지 않음)
                bUseModeChanger : true,			// 모드 탭(Editor | HTML | TEXT) 사용 여부 (true:사용/ false:사용하지 않음)
                fOnBeforeUnload : function(){
                    //alert("완료!");
                }
            }, //boolean
            fOnAppLoad : function(){
                //예제 코드
                //oEditors.getById["ir1"].exec("PASTE_HTML", ["로딩이 완료된 후에 본문에 삽입되는 text입니다."]);
            },
            fCreator: "createSEditor2"
        });
    });

    function changeType(type){
        $('[data-type="2"]').hide();
        if(type == '2')
            $('[data-type="2"]').show();
    }

    // 게시글 삭제
    $('.btn_delete').on('click', function(){
        let value = 'Y';
        let idx = $('#idx').val();
        let type = 'del_yn';
        let table = 'report';
        if(!idx)
            return;

        if(confirm('해당 항목을 삭제 하시겠습니까? 삭제된 항목을 복원되지 않습니다')) {
            $.ajax({
                url: controller+'/updateReportValue',
                type: 'POST',
                data: {
                    idx: idx,
                    value: value,
                    type: type
                },
                contentType: 'application/x-www-form-urlencoded; charset=UTF-8',
                success: function (result) {
                    if (result.result != 'success') {
                        alert('삭제 실패');
                    } else {
                        location.href = controller+"/reportList?type="+[[${params.type}]];
                    }
                }
            });
        }
    });

    // 게시글 저장(수정)
    $('.btn_save').on('click', function(){
        oEditors.getById["content"].exec("UPDATE_CONTENTS_FIELD", []);
        const form = document.getElementById('sForm');
        const fields = [form.title, form.file_name];
        const fieldNames = ['제목', '첨부파일'];

        for (let i = 0, len = fields.length; i < len; i++) {
            if ( !isValid(fields[i], fieldNames[i]) ) {
                return false;
            }
        }
        form.action = controller+'/insertReport';
        form.submit();
    });

    //제품이미지 삭제
    $(document).on("click",".btn-del",function(){
        var tr = $(this).parents('tr');

        if(confirm('등록된 파일을 삭제하시겠습니까?')){
            tr.find('.upload-name').val('');
            tr.find('.upload-file').remove();
            tr.find('.pre_path').val('');
            tr.find('.pre_name').val('');
            var $el = tr.find('.upload-hidden');
            $el.wrap('<form>').closest('form').get(0).reset();
            $el.unwrap();
        }
    });

    let g_params = [[${params}]];
    function goView(path, idx){
        let queryParams = {};
        if(g_params.page) queryParams['page'] = g_params.page;
        if(g_params.req_type) queryParams['req_type'] = g_params.req_type;
        if(g_params.status) queryParams['status'] = g_params.status;
        if(g_params.sub_type) queryParams['sub_type'] = g_params.sub_type;
        if(g_params.type) queryParams['type'] = g_params.type;
        if(g_params.keyword) queryParams['keyword'] = g_params.keyword;
        if(g_params.searchType) queryParams['searchType'] = g_params.searchType;
        if(idx)
            location.href = path+'?' + new URLSearchParams(queryParams).toString() + '&idx=' + idx;
        else
            location.href = path+'?' + new URLSearchParams(queryParams).toString();
    }

    /*]]>*/
</script>
<!--마이페이지 팝업-->
<th:block layout:fragment="popup" th:include="@{/admin/fragment/admin_popup}"></th:block>
</body>
</html>
