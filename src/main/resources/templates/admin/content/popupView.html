<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" >

<th:block layout:fragment="head" th:include="@{/admin/fragment/admin_head}"></th:block>

<body class="admin">
<th:block layout:fragment="header" th:include="@{/admin/fragment/admin_header}"></th:block>
<th:block layout:fragment="gnb" th:include="@{/admin/fragment/admin_gnb}"></th:block>
<div class="container">
	<th:block layout:fragment="lnb" th:include="@{/admin/fragment/admin_lnb}"></th:block>
	<!--content-->
	<form id="sForm" method="post" th:object="${data}">
		<input type="hidden" th:if="*{idx}" th:field="*{idx}" />
		<div class="content">
			<div>
				<header>
					<h3>팝업 관리 등록</h3>
				</header>
				<div class="breadcrumbs">
					<ol>
						<li>팝업 관리</li>
						<li>팝업 관리 목록</li>
						<li>팝업 관리 등록</li>
					</ol>
				</div>
				<div class="list-type">
					<div class="table-area">
						<table class="tbl-type02">
							<colgroup>
								<col style="width: 200px;">
								<col>
							</colgroup>
							<tbody>
							<tr>
								<th>제목</th>
								<td colspan="3"><input type="text" class="all" th:field="*{title}"  placeholder=""/></td>
							</tr>
							<tr>
								<th>노출위치</th>
								<td>
									<input type="radio" id="view01" value="1" name="lang" th:checked="*{lang eq '1'} or ${#strings.isEmpty(data.lang)}">
									<label for="view01">국문</label>
									<input type="radio" id="view02" value="2" name="lang"  th:checked="*{lang eq '2'}">
									<label for="view02">영문</label>
									<input type="radio" id="view03" value="3" name="lang"  th:checked="*{lang eq '3'}">
									<label for="view03">중문</label>
								</td>
								<th>노출매체<sup>*</sup></th>
								<td>
									<input type="checkbox" id="view04" value="Y" name="show_pc" th:checked="*{show_pc eq 'Y'}">
									<label for="view04">PC</label>
									<input type="checkbox" id="view05" value="Y" name="show_mo" th:checked="*{show_mo eq 'Y'}">
									<label for="view05">Mobile</label>
								</td>
							</tr>
							<tr>
								<th>게시기간</th>
								<td colspan="3">
									<input type="text" class="w100 date-set" placeholder="시작일" name="date1" th:value="*{#dates.format(start_date, 'yyyy-MM-dd')}">
									<select class="w80" id="hour1" name="hour1">
										<th:block th:each="num : ${#numbers.sequence(0,23)}">
										<option th:text="|${#numbers.formatInteger(num,2)}시|" th:value="${#numbers.formatInteger(num,2)}" th:selected="${#dates.hour(data.start_date) eq num}">시</option>
										</th:block>
									</select>
									<select class="w80" id="min1" name="min1">
										<th:block th:each="num : ${#numbers.sequence(0,59)}">
										<option th:text="|${#numbers.formatInteger(num,2)}분|" th:value="${#numbers.formatInteger(num,2)}" th:selected="${#dates.minute(data.start_date) eq num}"></option>
										</th:block>
									</select>
									-
									<input type="text" class="w100 date-set" placeholder="종료일" name="date2" th:value="*{#dates.format(end_date, 'yyyy-MM-dd')}">
									<select class="w80" id="hour2" name="hour2">
										<th:block th:each="num : ${#numbers.sequence(0,23)}">
											<option th:text="|${#numbers.formatInteger(num,2)}시|" th:value="${#numbers.formatInteger(num,2)}" th:selected="${#dates.hour(data.end_date) eq num}">시</option>
										</th:block>
									</select>
									<select class="w80" id="min2" name="min2">
										<th:block th:each="num : ${#numbers.sequence(0,59)}">
											<option th:text="|${#numbers.formatInteger(num,2)}분|" th:value="${#numbers.formatInteger(num,2)}" th:selected="${#dates.minute(data.end_date) eq num}"></option>
										</th:block>
									</select>
								</td>
							</tr>
							<tr>
								<th>PC 좌표(X)</th>
								<td><input type="text" class="all" th:field="*{pop_x}" placeholder=""/></td>
								<th>PC 좌표(Y)</th>
								<td><input type="text" class="all" th:field="*{pop_y}" placeholder=""/></td>
							</tr>
							<tr>
								<th>PC 사이즈(가로)</th>
								<td><input type="text" class="all" th:field="*{pop_w}" placeholder=""/></td>
								<th>PC 사이즈(세로)</th>
								<td><input type="text" class="all" th:field="*{pop_h}" placeholder=""/></td>
							</tr>
							<tr>
								<th>내용<sup>*</sup></th>
								<td colspan="3" >
									<textarea style="height:400px;" name="content" id="content" th:text="*{content}"></textarea>
								</td>
							</tr>
							</tbody>
						</table>
					</div>
					<div class="cont">
						<div class="btn-group">
							<th:block th:if="${data.idx == 0}">
								<a href="javascript:void(0);" class="btn gray02 large btn_cancel">취소</a>
								<a href="javascript:void(0);" class="btn c01 large btn_save">등록</a>
							</th:block>
							<th:block th:if="${data.idx > 0}">
								<a href="javascript:void(0);" class="btn gray02 large btn_delete">삭제</a>
								<a href="javascript:void(0);" class="btn c01 large btn_save">수정</a>
							</th:block>
						</div>
					</div>
				</div>
			</div>
			<th:block layout:fragment="footer" th:include="@{/admin/fragment/admin_footer}"></th:block>
		</div>
	</form>
	<!--//content-->
</div>
<script th:inline="javascript">
    /*<![CDATA[*/
    $(document).ready(function (){
    })

    let oEditors = [];
    $(document).ready(function(){
        nhn.husky.EZCreator.createInIFrame({
            oAppRef: oEditors,
            elPlaceHolder: "content",
            sSkinURI: "/smart_editor/SmartEditor2Skin.html",
            htParams : {
                bUseToolbar : true,				// 툴바 사용 여부 (true:사용/ false:사용하지 않음)
                bUseVerticalResizer : true,		// 입력창 크기 조절바 사용 여부 (true:사용/ false:사용하지 않음)
                bUseModeChanger : true,			// 모드 탭(Editor | HTML | TEXT) 사용 여부 (true:사용/ false:사용하지 않음)
                fOnBeforeUnload : function(){
                    //alert("완료!");
                }
            }, //boolean
            fOnAppLoad : function(){
                //예제 코드
                //oEditors.getById["ir1"].exec("PASTE_HTML", ["로딩이 완료된 후에 본문에 삽입되는 text입니다."]);
            },
            fCreator: "createSEditor2"
        });
    });

    // 게시글 취소
    $('.btn_cancel').on('click', function(){
        location.href = '/AdminMain/popupList';
    })

    // 게시글 삭제
    $('.btn_delete').on('click', function(){
        let value = 'Y';
        let idx = $('#idx').val();
        let type = 'del_yn';
        let table = 'popup';
        if(!idx || !value)
            return;

	    if(confirm('해당 팝업를 삭제 하시겠습니까? 삭제된 팝업는 복원되지 않습니다')) {
            $.ajax({
                url: '/AdminMain/updatePopupValue',
                type: 'POST',
                data: {
                    idx: idx,
                    value: value,
                    type: type
                },
                contentType: 'application/x-www-form-urlencoded; charset=UTF-8',
                success: function (result) {
                    if (result.result != 'success') {
                        alert('삭제 실패');
                    } else {
						location.href = "/AdminMain/popupList"
                    }
                }
            });
        }
    });

    // 게시글 저장(수정)
    $('.btn_save').on('click', function(){
        oEditors.getById["content"].exec("UPDATE_CONTENTS_FIELD", []);
        const form = document.getElementById('sForm');
        const fields = [form.content, form.lang];
        const fieldNames = ['내용', '노출위치'];

        for (let i = 0, len = fields.length; i < len; i++) {
            if ( !isValid(fields[i], fieldNames[i]) ) {
                return false;
            }
        }

        form.action = '/AdminMain/insertPopup';
        form.submit();
    });
    /*]]>*/
</script>
<!--마이페이지 팝업-->
<th:block layout:fragment="popup" th:include="@{/admin/fragment/admin_popup}"></th:block>
</body>
</html>
