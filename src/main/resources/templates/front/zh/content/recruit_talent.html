<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<th:block layout:fragment="head" th:include="@{/front/zh/fragment/front_head}"></th:block>
<body>
<div id="wrap">
	<th:block layout:fragment="header" th:include="@{/front/zh/fragment/front_header}"></th:block>
	<div id="sub_content" class="pt0 pb0">

		<div class="sRightpeople_case1">
			<div class="txt_box">
				<div>
					<h3 class="center">携手共进的<br>可绿纳乐人才画像</h3>
				</div>
				<div>
					<p class="txt">以可绿纳乐的核心价值为基础，<br class="mo_br">发掘并培育充满梦想与热忱的人才。</p>
				</div>
			</div>
			<div class="img_box"></div>
			<div class="bar"></div>
		</div>

		<div class="sRightpeople_case2 trigger1">
			<span id="rightpeople_lottie"></span>
			<span id="rightpeople_lottie_tab"></span>
			<span id="rightpeople_lottie_mo"></span>
			<div class="s-inner2">
				<p class="tit">可绿纳乐人</p>
				<dl>
					<dt>热忱</dt>
					<dd class="txt1">具有创意性、挑战精神的人才</dd>
					<dd class="txt2">用积极的思考方式坚持不懈地主导变化的人才</dd>
				</dl>
				<dl>
					<dt>专业性</dt>
					<dd class="txt1">在自己的领域内具备最尖端知识的人才</dd>
					<dd class="txt2">开发专业能力、勇攀高峰的人才</dd>
				</dl>
				<dl class="trigger2">
					<dt>团队合作</dt>
					<dd class="txt1">对公司与同事具有爱心的人才</dd>
					<dd class="txt2">具备相互尊重与关怀之心，为了同事与公司的发展而努力的人才</dd>
				</dl>
			</div>
		</div>

		<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.7.4/lottie.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.6.0/gsap.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.6.0/ScrollTrigger.min.js"></script>
		<script th:inline="javascript">
            /*<![CDATA[*/
            var animation = bodymovin.loadAnimation({
                container: document.getElementById('rightpeople_lottie'), // Required
                path: '/front/zh/images/sRightpeople.json', // Required
                renderer: 'svg', // Required
                loop: false, // Optional
                autoplay: false// Optional
            });

            ScrollTrigger.create({
                trigger: ".trigger1",
                start: "top center",
                end: () => "+=" + (document.querySelector(".trigger2").offsetTop + 550),
                onUpdate: self => {
                    console.log(self.progress);
                    animation.goToAndStop((self.progress * (420)), true)
                }
            })


            var animation_tab = bodymovin.loadAnimation({
                container: document.getElementById('rightpeople_lottie_tab'), // Required
                path: '/front/zh/images/sRightpeople_tab.json', // Required
                renderer: 'svg', // Required
                loop: false, // Optional
                autoplay: false// Optional
            });

            ScrollTrigger.create({
                trigger: ".trigger1",
                start: "top center",
                end: () => "+=" + (document.querySelector(".trigger2").offsetTop + 350),
                onUpdate: self => {
                    animation_tab.goToAndStop((self.progress * (420)), true)
                }
            })


            var animation_mo = bodymovin.loadAnimation({
                container: document.getElementById('rightpeople_lottie_mo'), // Required
                path: '/front/zh/images/sRightpeople_mo.json', // Required
                renderer: 'svg', // Required
                loop: false, // Optional
                autoplay: false// Optional
            });

            ScrollTrigger.create({
                trigger: ".trigger1",
                start: "top center",
                end: () => "+=" + (document.querySelector(".trigger2").offsetTop + 350),
                onUpdate: self => {
                    animation_mo.goToAndStop((self.progress * (420)), true)
                }
            })
            /*]]>*/
		</script>
	</div>
	<th:block layout:fragment="quick" th:include="@{/front/zh/fragment/front_quick}"></th:block>
	<th:block layout:fragment="footer" th:include="@{/front/zh/fragment/front_footer}"></th:block>
</div>
</body>
</html>
