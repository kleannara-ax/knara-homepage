<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<th:block layout:fragment="head" th:include="@{/front/zh/fragment/front_head}"></th:block>
<body>
<div id="wrap">
	<th:block layout:fragment="header" th:include="@{/front/zh/fragment/front_header}"></th:block>
	<div id="sub_content" class="sBoard">

		<div class="sub_top_box">
			<span id="sBoard_pc"></span>
			<span id="sBoard_tab" class="case2 tab_case3"></span>
			<div class="s-inner2">
				<h3>股票信息</h3>
				<p>为您提供可绿纳乐的股票信息。</p>
			</div>
		</div>

		<div class="s-inner2">

			<ul class="cate_box">
				<li class="on"><a href="javascript:void(0);"  title="实时股价">实时股价</a></li>
				<li><a href="/Invest/shareholder" title="股票现况">股票现况</a></li>
			</ul>

			<div class="board_invest_box case2">

				<div class="now_stock_box">
					<div class="box1">
						<p class="title">可绿纳乐 <span>(004540)</span></p>
						<span class="date" id="current_date">15-07-2022 17:59 为准</span>
					</div>

					<div class="box2">
						<div>
							<p class="price"><span class="num" id="F15001">3,335</span> <span class="won">(KRW)</span></p>
						</div>
						<div>
							<dl>
								<dt>同比前日</dt>
								<dd id="F15472"><i class="price_down"></i></dd>
							</dl>
							<dl>
								<dt>成交量</dt>
								<dd class="right" id="F15015"></dd>
							</dl>
							<dl>
								<dt>涨跌幅</dt>
								<dd id="F15004"><i class="price_down"></i></dd>
							</dl>
							<dl>
								<dt>成交额</dt>
								<dd class="right" id="F15023"></dd>
							</dl>
						</div>
					</div>

					<div class="box3">
						<table class="table_style2">
							<colgroup>
								<col width="60%">
								<col width="40%">
							</colgroup>
							<tbody>
							<tr>
								<th scope="row">时价</th>
								<td class="right" id="F15009"></td>
							</tr>
							<tr>
								<th scope="row">最高</th>
								<td class="right fc_01" id="F15010"><i class="price_up"></i></td>
							</tr>
							<tr>
								<th scope="row">最低</th>
								<td class="right fc_02" id="F15011"><i class="price_down"></i></td>
							</tr>
							<tr>
								<th scope="row">PRE</th>
								<td class="right" id="F13058"></td>
							</tr>
							<tr>
								<th scope="row">上市股票数</th>
								<td class="right" id="F16143"></td>
							</tr>
							</tbody>
						</table>
						<table class="table_style2">
							<colgroup>
								<col width="60%">
								<col width="40%">
							</colgroup>
							<tbody>
							<tr>
								<th scope="row">上限价格</th>
								<td class="right" id="F16117"></td>
							</tr>
							<tr>
								<th scope="row">下限价格</th>
								<td class="right" id="F16118"></td>
							</tr>
							<tr>
								<th scope="row">面值</th>
								<td class="right" id="F16046"></td>
							</tr>
							<tr>
								<th scope="row">52周最高(以收盘价为准)</th>
								<td class="right" id="F02133"></td>
							</tr>
							<tr>
								<th scope="row">52周最低(以收盘价为准)</th>
								<td class="right" id="F02155"></td>
							</tr>
							</tbody>
						</table>
					</div>
					<p class="txt1">* 本信息由KOSCOM(www.koscom.co.kr)提供</p>
				</div>

			</div>
		</div>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/waypoints/2.0.3/waypoints.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Counter-Up/1.0.0/jquery.counterup.min.js"></script>
	<script>
		$(document).ready(function(){
            getStockInfo();
		});

        function getStockInfo() {
            $.ajax({
                url: 'https://asp.koscom.co.kr/listservice/getStockBasic?code=004540&auth_key=vhAHopuizhHJRwQNfb3ApohjQJb7C0YA&gubun=K',
                type: 'GET',
                contentType: 'application/x-www-form-urlencoded; charset=UTF-8',
                success: function (result) {
                    let stock = result.results[0];
                    let F15006 = stock.F15006;
                    let stockStatus = 'up';
                    if (F15006 == '1' || F15006 == '2' || F15006 == '6' || F15006 == '7')
                        stockStatus = '<i class="price_up"></i>';
                    else if (F15006 == '4' || F15006 == '5' || F15006 == '8' || F15006 == '9')
                        stockStatus = '<i class="price_down"></i>';
                    $('#F15472').html(stockStatus + stock.F15472);
                    $('#F15001').html(stock.F15001);
                    $('#F15015').html(stock.F15015);
                    $('#F15004').html(stockStatus + stock.F15004);
                    $('#F15023').html(stock.F15023);
                    $('#F15009').html(stock.F15009);
                    $('#F15010').html("<i class=\"price_up\"></i>" + stock.F15010);
                    $('#F15011').html("<i class=\"price_down\"></i>" + stock.F15011);
                    $('#F13058').html(stock.F13058);
                    $('#F16143').html(stock.F16143);
                    $('#F16117').html(stock.F16117);
                    $('#F16118').html(stock.F16118);
                    $('#F16046').html(stock.F16046);
                    $('#F02133').html(stock.F02133);
                    $('#F02155').html(stock.F02155);
                    $('#current_date').html(stock.UPDATE_TIME+" 为准");

                    // 숫자 카운팅
                    $('.now_stock_box .box2 .price .num').counterUp({
                        delay: 10,
                        time: 2000
                    });
                }
            })
        }
		</script>

		<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.7.4/lottie.min.js"></script>

		<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.6.0/gsap.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.6.0/ScrollTrigger.min.js"></script>
		<script>
            var animation = bodymovin.loadAnimation({
                container: document.getElementById('sBoard_pc'), // Required
                path: '/front/zh/images/sInvest3.json', // Required
                renderer: 'svg', // Required
                loop: false, // Optional
                autoplay: false// Optional
            });

            animation.addEventListener('DOMLoaded', function () {
                animation.playSegments([1, 105], true);
            })

            var animation_tab = bodymovin.loadAnimation({
                container: document.getElementById('sBoard_tab'), // Required
                path: '/front/zh/images/sInvest3_tab.json', // Required
                renderer: 'svg', // Required
                loop: false, // Optional
                autoplay: false// Optional
            });

            animation_tab.addEventListener('DOMLoaded', function () {
                animation_tab.playSegments([1, 133], true);
            })
		</script>
	</div>
	<th:block layout:fragment="quick" th:include="@{/front/zh/fragment/front_quick}"></th:block>
	<th:block layout:fragment="footer" th:include="@{/front/zh/fragment/front_footer}"></th:block>
</div>
</body>
</html>
