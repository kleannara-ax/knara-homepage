<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
		<meta http-equiv="X-UA-Compatible" content="IE=Edge">
		<meta property="og:title" content="보솜이 | 놀땐, 보솜이" />
		<meta name="description" property="og:description" content="괜찮아 마음껏 즐겨봐, 아이의 소중한 순간을 담는 유아브랜드" />
		<meta property="og:image" content="img/bosomi_bi.jpg">
		<title>보솜이</title>

		<style>
			body {margin:0;}
			a,a:active {text-decoration:none;outline:none}
			img {display:block; width:100%;}
			#wrap {max-width:770px; margin:0 auto;}
			.blind {overflow:hidden;font-size:0;line-height:0;position:absolute;height:0;width:0}
			.bosomi .cont {position:relative;}
			.bosomi .cont .btn_wrap	{position:absolute; left:3.11%; right:3.11%; bottom:3.48%; display:flex; justify-content:space-between; height:12.54%;}
			.bosomi .cont .btn_wrap a {display:block; width:49.03%; height:100%;}

			/* 테블릿 가로, 테블릿 세로 (해상도 768px ~ 1023px)*/ 
			@media all and (min-width:768px) and (max-width:1023px) {
				#wrap {max-width:100%;}
			}
		</style>
	</head>
	<body>
		<div id="wrap" class="bosomi">
			<img src="./img/top_banner.jpg" alt="고객의 일상을 빛나게 만드는 기업 깨끗한나라">
			<div class="cont">
				<img src="./img/bosomi_visual.jpg" alt="괜찮아! 마음껏 즐겨봐 오늘부터 놀 땐, 보솜이. 아이의 소중한 순간을 담는 브랜드">
				<div class="btn_wrap">
					<a href="http://www.kleannara.co.kr/Brand/brandList?brand_idx=3" target="_blank">
						<span class="blind">브랜드 페이지 구경하기</span>
					</a>
					<a href="https://brand.naver.com/_bosomi" target="_blank">
						<span class="blind">보솜이 제품 구매하기</span>
					</a>
				</div>
			</div>
			<img src="./img/bosomi_btm_img.jpg" alt="보솜이">
		</div>
	</body>
</html>
